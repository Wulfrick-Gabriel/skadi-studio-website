<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Login — Skadi Studio</title>
  <link rel="icon" href="assets/logo-simbolo-azul.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="page-admin">
  <main class="admin-shell">
    <a class="brand admin-brand" href="index.html" aria-label="Skadi Studio — início">
      <img src="assets/logo-horizontal-preto.svg" alt="Skadi Studio" width="280" height="39" />
    </a>

    <section class="admin-card">
      <h1>Área restrita</h1>
      <p class="admin-lead">Entre para editar Projetos e Quem somos.</p>

      <form class="admin-form" data-login-form novalidate>
        <div class="field">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required minlength="6" />
        </div>
        <button class="btn btn-primary" type="submit">Entrar</button>
        <button class="btn btn-ghost-dark" type="button" data-signup>Criar conta admin</button>
        <p class="form-status" data-login-status role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
